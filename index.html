<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Hours Calc</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b10; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --text:#f2f1ee; --muted:#8b8b96; --gold:#e8c987; --gold2:#b98a3e;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    font:15px/1.5 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);
    background-image:
      radial-gradient(60% 50% at 15% 0%,rgba(185,138,62,.22),transparent 70%),
      radial-gradient(50% 45% at 100% 100%,rgba(90,80,200,.20),transparent 70%);
  }
  .card{
    width:100%;max-width:440px;padding:36px 32px;border-radius:28px;
    background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  h1{font:300 34px/1.15 Fraunces,serif;margin:6px 0 0;letter-spacing:-.01em}
  .head{display:flex;align-items:center;gap:12px;margin:0 0 24px}
  .head>div{flex:1;min-width:0}
  .head .logo{order:1}
  .logo{flex:none;width:160px;height:auto;border-radius:16px;box-shadow:0 10px 30px -8px rgba(232,201,135,.35)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.2s}
  .field:focus-within{border-color:var(--gold);background:rgba(232,201,135,.06);box-shadow:0 0 0 4px rgba(232,201,135,.08)}
  .field span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  input{
    width:100%;background:none;border:0;outline:0;color:var(--text);
    font:500 20px Inter,sans-serif;font-variant-numeric:tabular-nums;color-scheme:dark;
  }
  .leave{display:grid;grid-template-columns:1fr 1fr 34px;gap:12px;margin-bottom:12px}
  .leave button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:12px;cursor:pointer;font-size:18px}
  .leave button:hover{color:#ff8a8a;border-color:#ff8a8a}
  #add,#now{width:100%;padding:12px;border-radius:16px;border:1px dashed rgba(232,201,135,.4);background:none;color:var(--gold);font:500 14px Inter;cursor:pointer;transition:.2s}
  #add:hover,#now:hover{background:rgba(232,201,135,.08)}
  .wide{grid-column:span 2}
  #hbtn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:12px;border:1px solid var(--line);background:none;font-size:18px;cursor:pointer}
  #sbtn{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:12px;border:1px solid var(--line);background:none;font-size:16px;cursor:pointer}
  #sbtn:hover{border-color:var(--gold)}
  #own{display:none;margin-top:18px;text-align:center;color:var(--gold);font-size:13px}
  .view .grid,.view .sec,.view #leaves,.view .ctl,.view .acts,.view #hbtn,.view #sbtn{display:none!important}
  .view #own{display:block!important}
  #hbtn:hover{border-color:var(--gold)}
  dialog{width:min(92vw,400px);max-height:80vh;padding:24px;border-radius:24px;border:1px solid var(--line);background:#14141c;color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  #hist button{display:flex;justify-content:space-between;width:100%;margin-top:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--muted);font:500 13px Inter;cursor:pointer}
  #hist button.on{border-color:var(--gold);color:var(--gold)}
  .result{
    position:relative;    margin-top:26px;padding:26px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(232,201,135,.16),rgba(185,138,62,.05));
    border:1px solid rgba(232,201,135,.28);
  }
  .result small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  #end{
    font:300 64px/1.1 Fraunces,serif;margin:6px 0 2px;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  #end em{font:500 18px Inter,sans-serif;margin-left:6px;-webkit-text-fill-color:var(--gold);letter-spacing:.05em}
  .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin:22px 0 16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
  .stats b{display:block;color:var(--text);font:500 17px Inter;font-variant-numeric:tabular-nums}
  .stats div:last-child{text-align:right}
  #alarm,#cal,#share{width:100%;padding:12px;border-radius:16px;border:1px solid rgba(232,201,135,.4);background:none;color:var(--gold);font:500 14px Inter;cursor:pointer;transition:.2s}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  #alarm:hover,#cal:hover,#share:hover{background:rgba(232,201,135,.08)}
  #alarm.on{background:rgba(232,201,135,.16)}
  #alarm.ring{background:#c0392b;border-color:#c0392b;color:#fff;animation:pulse .6s infinite alternate}
  @keyframes pulse{to{opacity:.55}}
  .sec{margin:22px 0 10px}
  @media (max-width:480px){
    body{padding:10px;min-height:100dvh}
    .card{padding:18px 14px;border-radius:22px}
    h1{font-size:24px;margin:2px 0 0}
    .head{gap:12px;margin-bottom:14px}
    .logo{width:120px;border-radius:12px}
    h1 br{display:none}
    .grid,.leave{gap:8px}
    .leave{grid-template-columns:1fr 1fr 32px;margin-bottom:8px}
    .field{padding:8px 10px;border-radius:12px;min-width:0}
    .field span{font-size:10px}
    input{font-size:16px;min-width:0}
    .sec{margin:14px 0 8px}
    #add,#now{padding:9px;border-radius:12px}
    .result{margin-top:14px;padding:14px;border-radius:18px}
    #end{font-size:46px}
    .bar{margin:12px 0 10px}
    .acts{margin-top:12px;gap:8px}
    #alarm,#cal,#share{padding:10px 6px;border-radius:12px;font-size:13px}
  }
</style>
</head>
<body>
<main class="card">
  <header class="head">
    <svg class="logo" viewBox="-1 5 18 7" shape-rendering="crispEdges" role="img" aria-label="Thug life glasses"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d896"/><stop offset="1" stop-color="#b98a3e"/></linearGradient></defs><rect x="-1" y="5" width="18" height="7" rx="1.2" fill="url(#lg)"/><g fill="#0b0b10"><rect x="0" y="6" width="16" height="1"/><rect x="1" y="7" width="6" height="1"/><rect x="9" y="7" width="6" height="1"/><rect x="1" y="8" width="6" height="1"/><rect x="9" y="8" width="6" height="1"/><rect x="2" y="9" width="4" height="1"/><rect x="10" y="9" width="4" height="1"/><rect x="3" y="10" width="2" height="1"/><rect x="11" y="10" width="2" height="1"/></g><g fill="#464654"><rect x="2" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="2" y="8" width="1" height="1"/><rect x="10" y="7" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="10" y="8" width="1" height="1"/></g></svg>
    <div><div class="eyebrow">Time Planner</div><h1>When do I <br>clock out?</h1></div>
  </header>

  <div class="grid">
    <label class="field"><span>Clock in</span><input type="time" id="a" value="07:30"></label>
    <label class="field"><span>Total hours</span><input type="number" id="t" value="8" step="0.25" min="0"></label>
  </div>

  <div class="eyebrow sec">Leaves</div>
  <div id="leaves"></div>
  <div class="ctl" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <button id="now" type="button"></button>
    <button id="add" type="button">+ Add leave</button>
  </div>

  <section class="result">
    <button id="sbtn" type="button" title="Share live link" aria-label="Share live link">🔗</button>
    <button id="hbtn" type="button" title="History" aria-label="History">🕘</button>
    <small>Leave at</small>
    <div id="end"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats">
      <div><b id="done"></b>Worked</div>
      <div><b id="left"></b>Remaining</div>
    </div>
    <div class="acts">
      <button id="alarm" type="button"></button>
      <button id="cal" type="button" title="Download a calendar event with a system alert">📅 Add to calendar</button>
      <button id="share" type="button" class="wide">📤 Share card</button>
    </div>
  </section>
  <a id="own" href="">Plan my own day →</a>

</main>

<dialog id="hd">
  <div class="eyebrow">History</div>
  <div id="hist"></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const toMin = v => { const [h, n] = v.split(':'); return h * 60 + +n; };
const dur = m => `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;

function addLeave(out = '', back = '') {
  const d = document.createElement('div');
  d.className = 'leave';
  d.innerHTML = `<label class="field"><span>Leave out</span><input type="time" value="${out}"></label>
    <label class="field"><span>Back at</span><input type="time" value="${back}"></label>
    <button type="button" title="Remove">×</button>`;
  d.querySelector('button').onclick = () => { d.remove(); calc(); };
  $('leaves').append(d);
}

const KEY = 'workHoursCalc';
let view = false, db = { days: {} }, cur = new Date().toLocaleDateString('sv'); // days keyed YYYY-MM-DD (local)
function save() {
  if (view) return; // shared link is read-only: never overwrite the viewer's own data
  db.days[cur] = {
    a: $('a').value, t: $('t').value, end: endMin,
    leaves: [...document.querySelectorAll('.leave')].map(r => [...r.querySelectorAll('input')].map(i => i.value)),
  };
  try { localStorage[KEY] = JSON.stringify(db); } catch {} // storage blocked (private mode etc.): just don't persist
}
function show(d) {
  cur = d;
  const last = db.days[Object.keys(db.days).sort().pop()] || { a: '07:30', t: 8 }; // new day starts from latest day's settings
  const s = db.days[d] || { a: last.a, t: last.t, leaves: [] };
  $('a').value = s.a; $('t').value = s.t;
  $('leaves').innerHTML = '';
  s.leaves.forEach(([o, b]) => addLeave(o, b));
}
function load() {
  try { // shared link: #<base64 json of {d, a, t, leaves}>
    const v = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    view = true; cur = v.d; db = { days: { [v.d]: v }};
    document.body.classList.add('view');
    $('own').href = location.href.split('#')[0];
    return show(cur);
  } catch {}
  try {
    const s = JSON.parse(localStorage[KEY]);
    db = s.days ? s : { days: { [cur]: s } }; // old single-day format becomes today
  } catch {} // nothing saved yet or corrupt: keep defaults
  show(cur);
}
function history() {
  $('hist').innerHTML = Object.keys(db.days).sort().reverse().map(d => {
    const s = db.days[d], n = s.leaves.filter(l => l[0] && l[1]).length;
    return `<button type="button" data-d="${d}" class="${d === cur ? 'on' : ''}"><span>${new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</span><span>${s.a ? clock(toMin(s.a)) : '--'} → ${s.end >= 0 ? clock(s.end) : '--'}${n ? ` · ${n} leave${n > 1 ? 's' : ''}` : ''}</span></button>`;
  }).join('');
}
$('hbtn').onclick = () => $('hd').showModal();
$('hd').onclick = e => { if (e.target === $('hd')) $('hd').close(); }; // click backdrop to close
$('hist').onclick = e => { const d = e.target.closest('button')?.dataset.d; if (d) { show(d); calc(); $('hd').close(); } };

const openLeave = () => [...document.querySelectorAll('.leave')].find(r => { const i = r.querySelectorAll('input'); return i[0].value && !i[1].value; });
const nowHM = () => new Date().toTimeString().slice(0, 5);

function calc() {
  const isToday = cur === new Date().toLocaleDateString('sv');
  $('now').disabled = !isToday;
  $('now').textContent = openLeave() ? '↩ Back now' : '🚪 Leave now';
  const total = $('t').value * 60;
  if (!$('a').value || !(total > 0)) { $('end').textContent = '--:--'; endMin = -1; save(); history(); return; }
  let start = toMin($('a').value), done = 0;
  const segs = []; // worked segments [from, to] in minutes
  document.querySelectorAll('.leave').forEach(r => {
    const [o, b] = [...r.querySelectorAll('input')].map(i => i.value);
    // skip unfinished or out-of-order rows so they can't produce negative time
    if (!o || !b || toMin(o) < start || toMin(b) < toMin(o)) return;
    segs.push([start, toMin(o)]);
    done += toMin(o) - start;
    start = toMin(b);
  });
  const left = Math.max(total - done, 0);
  segs.push([start, start + left]);
  const end = (start + left) % 1440;
  endMin = end;
  save();
  history();
  const h = Math.floor(end / 60);
  $('end').innerHTML = `${(h % 12) || 12}:${String(end % 60).padStart(2, '0')}<em>${h < 12 ? 'AM' : 'PM'}</em>`;
  label();
  // worked so far = time actually elapsed inside each segment, up to the current clock time
  const n = new Date(), now = isToday ? n.getHours() * 60 + n.getMinutes() : 1440; // past day: all worked
  const worked = segs.reduce((t, [f, e]) => t + Math.max(Math.min(now, e) - f, 0), 0);
  $('done').textContent = dur(worked);
  $('left').textContent = dur(total - worked);
  $('bar').style.width = worked / total * 100 + '%';
}
// Alarm: page must stay open. AudioContext is created on the button click (browser autoplay rule).
let endMin = 0, armed = false, ringing = null, ctx;
const clock = m => `${(Math.floor(m / 60) % 12) || 12}:${String(m % 60).padStart(2, '0')} ${m < 720 ? 'AM' : 'PM'}`;
function label() {
  const b = $('alarm');
  b.className = ringing ? 'ring' : armed ? 'on' : '';
  b.textContent = ringing ? '🔕 Stop alarm' : armed ? `⏰ On · ${clock(endMin)}` : '🔔 In-page alarm';
}
function beep() {
  const o = ctx.createOscillator();
  o.frequency.value = 880;
  o.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + .3);
}
$('alarm').onclick = () => {
  if (ringing) { clearInterval(ringing); ringing = null; armed = false; }
  else armed = !armed;
  if (armed) { ctx ||= new AudioContext(); ctx.resume(); }
  label();
};
// Calendar event with system alerts (10 min before + at leave time); works with the page closed.
function ics() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const day = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
  const t = m => `T${p(Math.floor(m / 60))}${p(m % 60)}00`; // floating local time = device timezone
  const alarm = (trigger, text) => ['BEGIN:VALARM', `TRIGGER:${trigger}`, 'ACTION:DISPLAY', `DESCRIPTION:${text}`, 'END:VALARM'];
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Work Hours Calc//EN', 'BEGIN:VEVENT',
    `UID:${Date.now()}@workhourscalc`, `DTSTAMP:${d.toISOString().replace(/[-:]|\.\d+/g, '')}`,
    `DTSTART:${day}${t(endMin)}`, `DTEND:${day}${t(Math.min(endMin + 15, 1439))}`, 'SUMMARY:Time to clock out',
    ...alarm('-PT10M', 'Clock out in 10 minutes'), ...alarm('PT0M', 'Time to clock out'),
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
$('cal').onclick = () => {
  if (endMin < 0) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics()], { type: 'text/calendar' }));
  a.download = 'clock-out.ics';
  a.click();
  URL.revokeObjectURL(a.href);
};

// Share link: the state is encoded in the URL hash, so the recipient sees a live read-only card (no server)
$('sbtn').onclick = async () => {
  if (endMin < 0) return;
  const s = db.days[cur], v = { d: cur, a: s.a, t: s.t, leaves: s.leaves.filter(l => l[0] && l[1]) };
  const url = location.href.split('#')[0] + '#' + btoa(unescape(encodeURIComponent(JSON.stringify(v))));
  try {
    if (navigator.share) await navigator.share({ text: `I'm leaving at ${clock(endMin)}`, url });
    else { await navigator.clipboard.writeText(url); $('sbtn').textContent = '✓'; setTimeout(() => $('sbtn').textContent = '🔗', 1500); }
  } catch {}
};
// Share the card as a PNG drawn on a canvas (falls back to download when file sharing is unsupported)
$('share').onclick = async () => {
  if (endMin < 0) return;
  await document.fonts.ready;
  const c = document.createElement('canvas'), g = c.getContext('2d'), W = c.width = 800, H = c.height = 500;
  g.fillStyle = '#0b0b10'; g.fillRect(0, 0, W, H);
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#3a2f19'); bg.addColorStop(1, '#17150f');
  g.fillStyle = bg; g.beginPath(); g.roundRect(30, 30, W - 60, H - 60, 40); g.fill();
  g.strokeStyle = 'rgba(232,201,135,.45)'; g.lineWidth = 2; g.stroke();
  g.textAlign = 'center';
  g.fillStyle = '#e8c987'; g.font = '500 22px Inter, sans-serif'; g.letterSpacing = '5px'; g.fillText('LEAVE AT', W / 2, 105); g.letterSpacing = '0px';
  const [t, ap] = clock(endMin).split(' ');
  g.font = '300 130px Fraunces, serif'; const tw = g.measureText(t).width;
  g.font = '400 40px Fraunces, serif'; const aw = g.measureText(ap).width + 12;
  const x = (W - tw - aw) / 2;
  g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = '300 130px Fraunces, serif'; g.fillText(t, x, 250);
  g.fillStyle = '#e8c987'; g.font = '400 40px Fraunces, serif'; g.fillText(ap, x + tw + 12, 250);
  g.fillStyle = 'rgba(232,201,135,.2)'; g.beginPath(); g.roundRect(80, 300, W - 160, 10, 5); g.fill();
  g.fillStyle = '#e8c987'; g.beginPath(); g.roundRect(80, 300, (W - 160) * parseFloat($('bar').style.width || 0) / 100, 10, 5); g.fill();
  g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = '500 34px Inter, sans-serif'; g.fillText($('done').textContent, 80, 380);
  g.textAlign = 'right'; g.fillText($('left').textContent, W - 80, 380);
  g.fillStyle = '#9a98a6'; g.font = '400 22px Inter, sans-serif';
  g.textAlign = 'left'; g.fillText('Worked', 80, 415); g.textAlign = 'right'; g.fillText('Remaining', W - 80, 415);
  const file = new File([await new Promise(r => c.toBlob(r))], 'leave-time.png', { type: 'image/png' });
  try {
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], text: `I'm leaving at ${clock(endMin)}` });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); URL.revokeObjectURL(a.href); }
  } catch {} // share sheet dismissed
};

setInterval(() => {
  const n = new Date();
  if (armed && !ringing && n.getHours() * 60 + n.getMinutes() === endMin) {
    ringing = setInterval(beep, 700);
    label();
  }
}, 1000);

setInterval(calc, 30000); // keep worked/remaining live
document.addEventListener('input', calc);
$('add').onclick = () => addLeave();
$('now').onclick = () => {
  const r = openLeave();
  if (r) r.querySelectorAll('input')[1].value = nowHM(); else addLeave(nowHM());
  calc();
};
addEventListener('hashchange', () => location.reload()); // link opened in an already-open page
load();
calc();
</script>
<script data-goatcounter="https://ahmedmhussein.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
